<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Hexagon/Badge Gradient -->
    <linearGradient id="badgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Book Wing Left -->
    <linearGradient id="wingLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Book Wing Right -->
    <linearGradient id="wingRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Core Orb Glow -->
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="1" />
      <stop offset="60%" stop-color="#e11d48" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9f1239" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7c3aed" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Container -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#badgeGradient)" filter="url(#shadow)" />
  <rect x="24" y="24" width="464" height="464" rx="102" fill="url(#bgGradient)" opacity="0.92" />
  
  <!-- Outer Orbiting Cyber Ring -->
  <circle cx="256" cy="256" r="175" fill="none" stroke="url(#wingLeft)" stroke-width="4" stroke-dasharray="16 12" opacity="0.6" />

  <g filter="url(#glow)">
    <!-- Left Book Page -->
    <path d="M 256 340 C 210 310, 140 310, 96 335 L 96 175 C 140 150, 210 150, 256 180 Z" fill="url(#wingLeft)" />

    <!-- Right Book Page -->
    <path d="M 256 340 C 302 310, 372 310, 416 335 L 416 175 C 372 150, 302 150, 256 180 Z" fill="url(#wingRight)" />

    <!-- Book Center Spine Light -->
    <path d="M 256 180 L 256 340" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9" />

    <!-- Core Floating Star/Orb -->
    <circle cx="256" cy="140" r="32" fill="url(#orbGlow)" />
    <path d="M 256 115 L 262 134 L 281 140 L 262 146 L 256 165 L 250 146 L 231 140 L 250 134 Z" fill="#ffffff" />
  </g>
</svg>
